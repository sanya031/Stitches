<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selvedge studio</title>
  <meta name="description" content="Selvedge studio: the designed panel on the live thread renderer.">
  <link rel="stylesheet" href="../design/tokens.css">
  <link rel="stylesheet" href="../design/controls.css">
  <link rel="stylesheet" href="../design/icons/icons.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; margin: 0; overflow: hidden; background: var(--surface-bench); color: var(--text); font: var(--type-body); }
    .st-app { display: flex; flex: 1; min-height: 0; }
    .st-main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .st-bar { display: flex; align-items: center; gap: var(--space-12); padding: var(--space-8) var(--space-16); }
    .st-name { display: grid; gap: var(--space-2); margin-right: auto; }
    .st-name b { color: var(--text-strong); font: var(--type-subheading); }
    .st-name span { color: var(--text-muted); font: var(--type-caption); font-variant-numeric: var(--numeric); }
    .st-stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    .st-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #gl { cursor: crosshair; }
    #gl.pan { cursor: grab; }
    #gl.dragging { cursor: grabbing; }
    #overlay { pointer-events: none; }
    /* the cloth as it was before a change, fading out over the new stitches */
    #fade { pointer-events: none; opacity: 0; }
    /* a colour row's chip opens the colour picker */
    [data-hex] .c-row__art, [data-pattern-hex] .c-row__art { cursor: pointer; }
    .st-tools { position: absolute; left: var(--space-16); top: 50%; transform: translateY(-50%); z-index: var(--z-floating); }
    /* the selection bar floats above the selection (below it when there's no room); placed from studio.js */
    .st-selbar { position: absolute; left: 0; top: 0; z-index: var(--z-floating); transition: opacity 120ms linear; }
    .st-selbar[hidden], [data-outline-one][hidden], [data-outline-add][hidden] { display: none; }
    .st-selpop { position: fixed; z-index: var(--z-popover, 50); padding: var(--space-8); }
    .st-selpop .c-tilegrid { grid-template-columns: repeat(6, var(--stitch-tile)); }
    /* the pop-up is as wide as its tiles, no wider */
    .st-selpop.c-popover { width: max-content; max-width: calc(100vw - 16px); gap: var(--space-4); padding: var(--space-8); }
    /* the tiles to change to take a faint fill under the pointer, like a menu's items */
    .st-selpop .c-tile:hover:not([aria-pressed="true"]) { background: var(--surface-hover); }
    .st-selpop .c-group-label { padding: var(--space-4) var(--space-4) var(--space-2); }
    /* B · the chosen kind as one select box */
    .st-kindsel { display: flex; align-items: center; gap: var(--space-8); width: 100%; height: var(--control-sm); padding: 0 var(--space-8); border-radius: var(--radius-md); background: var(--surface-well); color: var(--text); font: var(--type-label); }
    .st-kindsel .c-select__value { flex: 1; text-align: left; }
    .st-kindsel > .c-ic { width: var(--space-12); height: var(--space-12); color: var(--icon); }
    /* C · a pill per kind */
    /* four to a row (All and three kinds); more kinds wrap onto rows below, so the pop-up never grows wider */
    .st-kindpills { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; background: var(--surface-well); }
    .st-kindpills .c-seg__opt { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-4); min-width: 0; padding: 0 var(--space-6, 6px); }
    .st-kindpills .c-selbar__art, .st-kindpills .c-selbar__art svg { width: 16px; height: 16px; }
    .st-pilln { color: var(--text-muted); font: var(--type-caption); font-variant-numeric: var(--numeric); }
    /* D · a row per stitch-and-colour group, colour | stitch in a box like the bar's */
    .st-grouplist { max-height: 240px; overflow: auto; }
    .st-grouprow { cursor: default; }
    .st-grouprow .c-selbar__thread { height: 28px; }
    .st-grouprow .c-selbar__half { padding: 0 var(--space-6, 6px); }
    /* Zoom in the Canvas section: the number is typed into, not scrubbed, so no move cursor */
    .st-zoomfield .c-cellsize__box, .st-zoomfield .c-cellsize__box .c-field__cell--num, .st-zoomfield .c-cellsize__box input { cursor: text; user-select: text; }
    .st-zoomfield .c-cellsize__box input { width: 3ch; field-sizing: content; min-width: 2ch; }
    .st-panel { flex: none; height: 100%; }
    .st-fallback { position: absolute; inset: 0; display: none; place-items: center; color: var(--text-muted); }
    @media (max-width: 860px) {
      body { overflow: auto; height: auto; }
      .st-app { flex-direction: column; }
      .st-stage { min-height: 70vh; }
      .st-panel { width: 100%; height: auto; border-left: 0; border-top: var(--border-width) solid var(--border-subtle); }
    }
  </style>
</head>
<body>
  <div class="st-app">
    <main class="st-main">
      <div class="st-bar" id="bar"></div>
      <div class="st-stage" id="stage">
        <canvas id="gl"></canvas>
        <canvas id="fade"></canvas>
        <canvas id="overlay"></canvas>
        <div class="st-fallback" id="fallback">This needs WebGL2, which this browser doesn't have.</div>
        <div id="floating"></div>
        <div id="selbar" class="st-selbar" hidden></div>
      </div>
    </main>
    <aside class="c-panel st-panel" id="panel" aria-label="Properties"></aside>
  </div>
  <input type="file" accept="image/*" id="file" hidden>
  <div class="c-toast" id="toast" role="status" aria-live="polite" style="position:fixed;left:50%;bottom:var(--space-24);transform:translateX(-50%);opacity:0;pointer-events:none;z-index:var(--z-toast);transition:opacity .2s"></div>
  <script type="module" src="studio.js"></script>
  <script type="module" src="../design/agentation.js"></script>
</body>
</html>
