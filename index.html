<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selvedge Thread Lab</title>
  <meta name="description" content="Cross stitch playground: place stitches and fills on a dot grid, Aida, linen or denim, plan your own pattern, and zoom from colour blobs to fibres.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ground: #121418; --panel: #16181D; --raised: #1E2128; --well: #0F1114; --line: #262A32; --line-3: #3A3F49;
      --text: #EEE9E0; --muted: #B5BAC3; --dim: #9AA0AB; --accent: #E9B949; --accent-ink: #1A1305;
      --font: 'Instrument Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ground); color: var(--text); font-family: var(--font); font-size: 14px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .layout { display: grid; grid-template-columns: 1fr 340px; height: 100%; }
    .stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #gl { cursor: crosshair; }
    #gl.pan { cursor: grab; }
    #gl.dragging { cursor: grabbing; }
    #overlay { pointer-events: none; }
    .mono { font-family: var(--mono); font-size: 12px; }
    .title { position: absolute; left: 16px; top: 16px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    .title .mono { color: var(--dim); }
    .hud { position: absolute; left: 16px; bottom: 16px; right: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: max-content; max-width: calc(100% - 32px);
      padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    .readout { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; min-width: 140px; }
    .readout .mono { color: var(--muted); }
    .readout strong { font-weight: 600; }

    button { font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--line-3); border-radius: 999px;
      min-height: 44px; min-width: 44px; padding: 0 16px; cursor: pointer; }
    button:hover { border-color: #565C68; }
    .pill { display: flex; flex-wrap: wrap; background: var(--well); border: 1px solid var(--line); border-radius: 26px; padding: 3px; gap: 2px; }
    .pill button { background: transparent; border-color: transparent; padding: 0 14px; }
    .pill button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

    .panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 22px; }
    .panel h2 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
    .card { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 6px 6px 8px; border-radius: 10px; min-height: 44px;
      background: var(--well); border-color: var(--line); text-align: left; }
    .card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .card .art svg { display: block; width: 100%; height: auto; max-height: 64px; }
    .card-name { font-size: 13px; font-weight: 500; padding: 0 2px; }
    .thread-current { display: flex; align-items: center; gap: 10px; width: 100%; border-radius: 12px; padding: 6px 12px 6px 6px; text-align: left; }
    .thread-current[aria-expanded="true"] { border-color: var(--accent); }
    .thread-label { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .thread-label .mono { color: var(--dim); }
    .change { color: var(--accent); font-size: 13px; }
    .palette { margin-top: 8px; padding: 8px; background: var(--well); border: 1px solid var(--line); border-radius: 12px; }
    .skeins, .recents { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
    .recents { margin-top: 8px; }
    .skeins button, .recents button { padding: 0; height: 44px; border-radius: 10px; background: var(--well); border-color: var(--line); display: grid; place-items: center; }
    .recents button { background: transparent; }
    .skeins button[aria-pressed="true"], .recents button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .custom { display: flex; align-items: center; gap: 10px; margin-top: 8px; color: var(--muted); }
    .custom input { width: 44px; height: 44px; padding: 0; border: 1px solid var(--line-3); border-radius: 10px; background: var(--well); cursor: pointer; }
    .count-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .sub { color: var(--muted); min-width: 44px; }
    .switch { display: inline-flex; align-items: center; gap: 10px; background: transparent; border-color: transparent; padding: 0 4px; margin-top: 4px; }
    .switch .track { width: 40px; height: 24px; border-radius: 999px; background: var(--line-3); position: relative; transition: background .15s; }
    .switch .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--text); transition: transform .15s; }
    .switch[aria-checked="true"] .track { background: var(--accent); }
    .switch[aria-checked="true"] .knob { transform: translateX(16px); background: var(--accent-ink); }
    @media (prefers-reduced-motion: reduce) { .switch .track, .switch .knob { transition: none; } }
    .slider { display: grid; grid-template-columns: 64px 1fr 40px; align-items: center; gap: 10px; min-height: 44px; }
    .slider label { color: var(--muted); }
    .slider input { width: 100%; height: 44px; accent-color: var(--accent); background: transparent; }
    .slider output { text-align: right; color: var(--dim); }
    .hint { color: var(--dim); font-size: 13px; line-height: 1.5; margin: 8px 0; }
    .custom-size { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); }
    .custom-size label { display: flex; align-items: center; gap: 6px; }
    .custom-size input { width: 84px; min-height: 44px; font: inherit; font-family: var(--mono); font-size: 13px; color: var(--text); background: var(--well); border: 1px solid var(--line-3); border-radius: 10px; padding: 0 10px; }
    .sel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .sel-head h2 { margin: 0; }
    button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
    .panel h3 { margin: 16px 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
    button.wide { width: 100%; }
    #pic-empty button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
    .pic-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .pic-head img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
    .pic-meta { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .pic-meta span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pic-meta .mono { color: var(--dim); }
    .tone-row { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 10px; margin-top: 6px; }
    .tone-row label { color: var(--muted); }
    select { font: inherit; color: var(--text); background: var(--well); border: 1px solid var(--line-3); border-radius: 10px; min-height: 44px; padding: 0 10px; width: 100%; }
    .floss-list { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .floss-list button { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px; width: 100%; padding: 0 12px 0 2px; border-radius: 10px; background: var(--well); border-color: var(--line); text-align: left; }
    .floss-list button[aria-pressed="true"] { border-color: var(--accent); }
    .floss-list .mono { color: var(--dim); }
    .floss-total { color: var(--dim); text-align: right; padding: 4px 12px 0; }
    .stage-tip { position: fixed; z-index: 20; width: max-content; max-width: min(392px, calc(100vw - 16px)); padding: 12px; background: var(--raised); border: 1px solid var(--line-3); border-radius: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45); pointer-events: none; }
    .stage-title { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
    .stage-strip { display: flex; gap: 8px; }
    .stage { margin: 0; display: grid; justify-items: center; gap: 4px; }
    .stage svg { display: block; border-radius: 8px; outline: 1px solid var(--line-3); outline-offset: 0; }
    .stage figcaption { color: var(--dim); }
    .stage.now figcaption { color: var(--text); }
    .stage.on svg { outline: 2px solid var(--accent); outline-offset: 2px; }
    .stage.on figcaption { color: var(--accent); font-weight: 600; }
    .stage-say { margin: 10px 0 0; font-size: 13px; line-height: 1.45; color: var(--text); max-width: 360px; }
    .stage-note { margin: 4px 0 0; color: var(--muted); line-height: 1.45; max-width: 360px; }
    .fallback { position: absolute; inset: 0; display: none; place-items: center; padding: 16px; text-align: center; color: var(--muted); }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr 46%; }
      .panel { border-left: 0; border-top: 1px solid var(--line); }
      .title, .readout { display: none; }
      .hud { left: 8px; bottom: 8px; padding: 4px; gap: 4px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <main class="stage">
      <canvas id="gl" aria-label="Stitching canvas. Click or drag to use the current tool. Scroll or pinch to zoom; right-drag, middle-drag or hold Space to pan."></canvas>
      <canvas id="overlay" aria-hidden="true"></canvas>
      <div class="title">
        <div><strong>Thread lab</strong> · build step 1</div>
        <div class="mono" id="size"></div>
      </div>
      <div class="hud" role="toolbar" aria-label="View">
        <div class="readout" aria-live="polite">
          <strong id="lod">Mid</strong>
          <span class="mono" id="zoom"></span>
        </div>
        <div class="pill" role="group" aria-label="Zoom preset">
          <button data-preset="far">Far</button>
          <button data-preset="mid">Mid</button>
          <button data-preset="close">Close</button>
        </div>
        <button id="reset">Fit</button>
      </div>
      <div class="fallback" id="fallback">This prototype needs WebGL2.</div>
    </main>
    <aside class="panel" id="panel" aria-label="Stitching controls"></aside>
  </div>
  <script type="module" src="lab/main.js"></script>
</body>
</html>
