<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selvedge panel</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="controls.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; margin: 0; background: var(--surface-bench); color: var(--text); font: var(--type-body); }
    .pp-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-12); padding: var(--space-8) var(--space-16); background: var(--surface-panel); border-bottom: var(--border-width) solid var(--border-subtle); }
    .pp-top strong { color: var(--text-strong); font: var(--type-heading); }
    .pp-tabs a { text-decoration: none; }
    .pp-demo { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-12); margin-left: auto; color: var(--text-muted); font: var(--type-label); }
    .pp-demo label { display: inline-flex; align-items: center; gap: var(--space-8); }
    .pp-demo select { min-height: var(--control-sm); padding: 0 var(--space-8); border: var(--border-width) solid var(--border); border-radius: var(--radius-md); background: var(--surface-field); color: var(--text); font: var(--type-label); }
    .pp-app { display: flex; flex: 1; min-height: 0; }
    .pp-stage { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .pp-appbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-12); padding: var(--space-8) var(--space-16); }
    .pp-name { display: grid; gap: var(--space-2); margin-right: auto; }
    .pp-name b { color: var(--text-strong); font: var(--type-subheading); }
    .pp-name span { color: var(--text-muted); font: var(--type-caption); letter-spacing: var(--type-caption-tracking); font-variant-numeric: var(--numeric); }
    .pp-canvas { position: relative; flex: 1; min-height: 360px; display: grid; place-items: center; padding: var(--space-24) var(--space-24) var(--space-24) calc(var(--toolbar-width) + var(--space-32)); }
    /* the cloth is content, not chrome: a plain square of fabric with its holes */
    .pp-cloth { width: min(520px, 100%); aspect-ratio: 4 / 3; border-radius: var(--radius-xs); background: var(--neutral-50); color: var(--neutral-300); }
    .pp-cloth svg { display: block; width: 100%; height: 100%; }
    .pp-tools { position: absolute; left: var(--space-16); top: 50%; transform: translateY(-50%); z-index: var(--z-floating); }
    .pp-zoom { position: absolute; right: var(--space-16); bottom: var(--space-16); z-index: var(--z-floating); }
    .pp-note { position: absolute; left: 50%; bottom: var(--space-16); transform: translateX(-50%); color: var(--text-muted); font: var(--type-caption); letter-spacing: var(--type-caption-tracking); }
    .pp-panel { flex: none; height: 100%; }
    @media (max-width: 860px) {
      body { height: auto; }
      .pp-app { flex-direction: column; }
      .pp-canvas { min-height: 280px; padding-left: var(--space-24); }
      .pp-tools { display: none; }
      .pp-panel { width: 100%; height: auto; border-left: 0; border-top: var(--border-width) solid var(--border-subtle); }
    }
  </style>
</head>
<body>
  <header class="pp-top">
    <strong>Selvedge</strong>
    <nav class="c-seg pp-tabs" aria-label="Design system">
      <a class="c-seg__opt c-focus" href="./">Foundations and icons</a>
      <a class="c-seg__opt c-focus" href="controls.html">Controls</a>
      <a class="c-seg__opt c-focus is-selected" href="panel.html" aria-current="page">Panel</a>
    </nav>
    <div class="pp-demo" aria-label="Preview settings">
      <label>Showing <select id="context"><option value="tool">Nothing selected</option><option value="selection">A selection</option><option value="image">An image</option><option value="text">Text</option></select></label>
      <label>Pill style <select id="pill-style"></select></label>
      <div class="c-seg" role="group" aria-label="Theme" id="theme">
        <button class="c-reset c-seg__opt c-focus" data-theme-pick="light">Light</button>
        <button class="c-reset c-seg__opt c-focus" data-theme-pick="dark">Dark</button>
      </div>
    </div>
  </header>
  <div class="pp-app">
    <div class="pp-stage">
      <div class="pp-appbar" id="appbar"></div>
      <div class="pp-canvas" id="canvas"></div>
    </div>
    <aside class="c-panel pp-panel" id="panel" aria-label="Properties"></aside>
  </div>
  <div class="c-toast ct-toast" id="toast" role="status" aria-live="polite" style="position:fixed;left:50%;bottom:var(--space-24);transform:translateX(-50%);opacity:0;pointer-events:none;z-index:var(--z-toast)"></div>
  <script type="module" src="panel.js"></script>
</body>
</html>
