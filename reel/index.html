<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=400">
  <title>Slider progression</title>
  <link rel="stylesheet" href="../design/tokens.css">
  <link rel="stylesheet" href="../design/controls.css">
  <link rel="stylesheet" href="reel.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 400px; height: 400px; overflow: hidden; } /* recorded at 2.7×: 1080 square */
    body { position: relative; background: var(--surface-bench); color: var(--text); font: var(--type-body); }
    /* the stage: every version in the same place, so one can morph into the next */
    .r-stage { position: absolute; left: 50px; right: 50px; top: 236px; } /* versions hang from here, so each box sits in the same place */
    .r-layer { position: absolute; left: 0; right: 0; bottom: 0; transition: opacity 480ms cubic-bezier(.22, 1, .36, 1), filter 480ms cubic-bezier(.22, 1, .36, 1), transform 480ms cubic-bezier(.22, 1, .36, 1); }
    .r-layer.is-out { opacity: 0; filter: blur(6px); transform: scale(0.97); pointer-events: none; }
    .r-layer.is-in { opacity: 0; filter: blur(6px); transform: scale(1.03); }
    .r-layer--inline { padding-top: calc(var(--icon-sm) + var(--space-6)); } /* label inside the box: the room a label above takes, so every box sits at the same height */
    /* progress: a bar per version, filling as the drag passes through it */
    .r-bars { position: absolute; left: 50px; right: 50px; bottom: 44px; display: grid; grid-template-columns: repeat(8, 1fr); gap: var(--space-6); }
    .r-bar { display: grid; gap: var(--space-6); }
    .r-track { position: relative; height: var(--space-4); overflow: hidden; border-radius: var(--radius-pill); background: var(--surface-selected); }
    .r-track i { position: absolute; inset: 0; width: calc(var(--fill, 0) * 100%); border-radius: inherit; background: var(--text-strong); }
    .r-name { color: var(--text-muted); font: var(--type-caption); font-variant-numeric: var(--numeric); text-align: center; transition: color 240ms ease; }
    .r-bar.is-on .r-name { color: var(--text-strong); }
  </style>
</head>
<body>
  <div class="r-stage" id="stage"></div>
  <div class="r-bars" id="bars"></div>
  <script type="module" src="reel.js"></script>
</body>
</html>
